<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoikigai CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: {} },
            safelist: [
                'text-yellow-400','text-red-400','text-cyan-400','text-emerald-400','text-purple-400',
                'text-slate-400','text-blue-400','text-amber-400','text-sky-400',
                'border-yellow-500','border-red-500','border-cyan-500','border-emerald-500','border-purple-500',
                'border-slate-500','border-blue-500','border-amber-500','border-sky-500'
            ]
        }
    </script>
    <style>
        :root {
            --black: #000000;
            --surface: #0a0a0a;
            --card: #111111;
            --card-hover: #181818;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --cyan: #00E0FF;
            --cyan-glow: rgba(0,224,255,0.15);
            --cyan-dim: rgba(0,224,255,0.5);
            --red: #FF004D;
            --green: #00FF88;
            --text: #E8E8E8;
            --text-dim: #888888;
            --text-muted: #555555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--black);
            color: var(--text);
            font-family: "Outfit", sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient teal edge glow */
        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -10%;
            width: 120%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 100%, rgba(0,224,255,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── HEADER ── */
        .crm-header {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }
        .logo-text {
            font-family: "Bebas Neue", sans-serif;
            font-size: 22px;
            letter-spacing: 0.08em;
            color: var(--text);
        }
        .logo-text span { color: var(--cyan); }

        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px 7px 36px;
            color: var(--text);
            font-family: "Outfit", sans-serif;
            font-size: 13px;
            font-weight: 400;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box::placeholder { color: var(--text-muted); font-weight: 300; }
        .search-box:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }

        .status-badge {
            display: flex; align-items: center; gap: 6px;
            font-family: "Bebas Neue", sans-serif;
            font-size: 13px;
            letter-spacing: 0.12em;
            color: var(--green);
            padding: 4px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0,255,136,0.15);
            background: rgba(0,255,136,0.05);
        }
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── NICHE TABS ── */
        .niche-tab {
            padding: 10px 16px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: "Bebas Neue", sans-serif;
            font-size: 14px;
            letter-spacing: 0.1em;
            opacity: 0.4;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .niche-tab:hover {
            opacity: 0.75;
            color: var(--text);
        }
        .niche-tab.active {
            opacity: 1;
            color: var(--cyan);
            border-bottom-color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan-glow);
        }

        /* ── KANBAN ── */
        .kanban-board {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 14px;
            overflow-x: auto;
            position: relative;
            z-index: 1;
        }
        .kanban-column {
            min-width: 275px;
            max-width: 275px;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            height: calc(100vh - 120px);
            animation: col-up 0.4s cubic-bezier(0.16,1,0.3,1) backwards;
        }
        .kanban-column:nth-child(1) { animation-delay: 0s; }
        .kanban-column:nth-child(2) { animation-delay: 0.05s; }
        .kanban-column:nth-child(3) { animation-delay: 0.1s; }
        .kanban-column:nth-child(4) { animation-delay: 0.15s; }
        .kanban-column:nth-child(5) { animation-delay: 0.2s; }
        .kanban-column:nth-child(6) { animation-delay: 0.25s; }
        @keyframes col-up {
            from { opacity: 0; transform: translateY(16px); }
        }
        .column-drag-over {
            border-color: var(--cyan) !important;
            box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 20px var(--cyan-glow);
        }
        .kanban-column-header {
            padding: 12px 14px;
            font-family: "Bebas Neue", sans-serif;
            font-size: 13px;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kanban-cards {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── CARDS ── */
        .kanban-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .sortable-ghost {
            opacity: 0.3;
            background: var(--cyan-glow) !important;
            border: 1px dashed var(--cyan) !important;
        }
        .sortable-drag {
            opacity: 1 !important;
            transform: rotate(2deg) scale(1.02);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6) !important;
            cursor: grabbing !important;
        }
        .kanban-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            background: var(--card-hover);
        }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card.dragging { opacity: 0.4; border-color: var(--cyan); border-style: dashed; }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: none; place-items: center;
            z-index: 50; padding: 20px;
        }
        .modal-overlay.active { display: grid; }
        .modal-content {
            background: var(--surface);
            width: 100%; max-width: 800px; max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow-y: auto;
            box-shadow: 0 0 60px var(--cyan-glow), 0 40px 80px rgba(0,0,0,0.5);
            animation: modal-in 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes modal-in { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

        .editable-input {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text);
            width: 100%;
            font-family: "Outfit", sans-serif;
            transition: all 0.2s;
            padding: 5px 8px;
        }
        .editable-input:hover { border-color: var(--border); background: var(--card); }
        .editable-input:focus { outline: none; border-color: var(--cyan); background: var(--card); box-shadow: 0 0 0 2px var(--cyan-glow); }

        /* ── LOADER & TOAST ── */
        .loader { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; place-items: center; }
        .loader.active { display: grid; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border-hover); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 10px 18px; border-radius: 8px;
            font-family: "Outfit", sans-serif; font-weight: 600; font-size: 13px;
            transform: translateY(80px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            z-index: 200; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        .section-label {
            font-family: "Bebas Neue", sans-serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }
        .count-pill {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px; font-weight: 500;
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            padding: 1px 7px;
            border-radius: 99px;
        }
    </style>
</head>
<body>

    <header class="crm-header">
        <div class="flex justify-between items-center px-5 py-3 gap-4">
            <div class="flex items-center gap-2.5">
                <i class="ph-fill ph-crosshair" style="color:var(--cyan);font-size:22px"></i>
                <div class="logo-text">AUTO<span>IKIGAI</span></div>
                <div style="font-family:'Bebas Neue';font-size:12px;letter-spacing:0.15em;color:var(--text-muted);margin-left:8px;border-left:1px solid var(--border);padding-left:10px">CRM_PIPELINE</div>
            </div>
            <div class="flex-1 max-w-sm relative">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2" style="color:var(--text-muted);font-size:14px"></i>
                <input type="text" id="searchInput" placeholder="SEARCH LEADS..." class="search-box">
            </div>
            
            <div class="flex items-center gap-1 bg-black/40 p-1 rounded-lg border border-white/10 shrink-0">
                <button id="btn-region-us" onclick="switchRegion('us')" class="px-4 py-1.5 rounded text-xs font-bold transition-colors bg-white/10 text-white shadow-sm border border-white/5">US</button>
                <button id="btn-region-uk" onclick="switchRegion('uk')" class="px-4 py-1.5 rounded text-xs font-bold transition-colors text-zinc-500 hover:text-white border border-transparent">UK</button>
            </div>

            <div class="status-badge"><span class="status-dot"></span> CORE ONLINE</div>
        </div>
        <div id="niche-tabs" class="flex overflow-x-auto scrollbar-hide px-4"></div>
    </header>
    
    <main id="kanban-board" class="kanban-board scrollbar-hide"></main>

    <!-- ── MODAL ── -->
    <div id="leadModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-header-bg" class="px-7 py-5 flex justify-between items-start sticky top-0 z-20 rounded-t-2xl" style="background:var(--surface);border-bottom:1px solid var(--border);border-top:3px solid var(--cyan)">
                <div class="flex-1 mr-4">
                    <input type="text" id="modal-input-company" class="editable-input text-2xl font-bold -ml-2" style="font-family:'Bebas Neue';font-size:28px;letter-spacing:0.04em" oninput="debouncedSaveModalLead()">
                    <div class="flex items-center gap-4 text-sm mt-2" style="color:var(--text-muted)">
                        <span id="modal-location" class="flex items-center gap-1"></span>
                        <span class="flex items-center gap-1"><i class="ph-bold ph-calendar-plus"></i> <span id="modal-created-at" style="font-family:'JetBrains Mono';font-size:11px"></span></span>
                        <span class="flex items-center gap-1"><i class="ph-bold ph-clock"></i> <span id="modal-last-contacted" style="font-family:'JetBrains Mono';font-size:11px"></span></span>
                    </div>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                    <select id="modal-stage-select" class="font-semibold text-sm rounded-lg p-2 cursor-pointer" style="background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Bebas Neue';letter-spacing:0.08em;font-size:14px" onchange="saveModalLead()"></select>
                    <button onclick="closeModal()" class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:var(--card);color:var(--text-muted);border:1px solid var(--border)"><i class="ph-bold ph-x"></i></button>
                </div>
            </div>

            <div class="p-7 grid grid-cols-1 md:grid-cols-2 gap-7">
                <div class="space-y-5">
                    <div>
                        <h4 class="section-label mb-2 flex items-center gap-2"><i class="ph-fill ph-address-book"></i> CONTACT INFO</h4>
                        <div class="rounded-xl p-4 space-y-2.5" style="background:var(--card);border:1px solid var(--border)">
                            <div class="flex items-center gap-3"><i class="ph-fill ph-phone w-4" style="color:var(--text-muted)"></i><input type="text" id="modal-input-phone" class="editable-input text-sm" style="font-family:'JetBrains Mono'" placeholder="Company Phone" oninput="debouncedSaveModalLead()"></div>
                            <div class="flex items-center gap-3"><i class="ph-fill ph-globe w-4 cursor-pointer" style="color:var(--cyan)" onclick="openWebsite()"></i><input type="text" id="modal-input-website" class="editable-input text-sm" style="font-family:'JetBrains Mono';color:var(--cyan)" placeholder="Website" oninput="debouncedSaveModalLead()"></div>
                            <div class="flex items-center gap-3"><i class="ph-fill ph-map-pin w-4" style="color:var(--text-muted)"></i><input type="text" id="modal-input-city-state" class="editable-input text-sm" placeholder="City, State" oninput="debouncedSaveModalLead()"></div>
                            <div class="flex items-center gap-3"><i class="ph-fill ph-star w-4" style="color:#FFB020"></i><input type="text" id="modal-input-rating" class="editable-input text-sm" style="font-family:'JetBrains Mono'" placeholder="Rating" oninput="debouncedSaveModalLead()"></div>
                        </div>
                    </div>
                    <div id="decision-maker-section">
                        <h4 class="section-label mb-2 flex items-center justify-between mt-4">
                            <span class="flex items-center gap-2"><i class="ph-fill ph-users"></i> DECISION MAKERS</span>
                            <button onclick="addDmField()" class="text-[#00E0FF] hover:text-white transition-colors"><i class="ph-bold ph-plus"></i> Add DM</button>
                        </h4>
                        <div id="modal-dms-container" class="space-y-3">
                            <!-- Populated by JavaScript -->
                        </div>
                        
                        <!-- Outreach Tracking Area -->
                        <div class="rounded-xl p-4 mt-3 space-y-2 border border-white/5 bg-white/5">
                            <h5 class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-1">Multi-Touch Outreach</h5>
                            <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer hover:text-white transition-colors">
                                <input type="checkbox" id="modal-check-email" class="rounded bg-black border-white/20 text-[#00E0FF] focus:ring-[#00E0FF]/30 accent-[#00E0FF]" onchange="saveModalLead()">
                                Email Outreach Sent
                            </label>
                            <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer hover:text-white transition-colors">
                                <input type="checkbox" id="modal-check-linkedin" class="rounded bg-black border-white/20 text-[#00E0FF] focus:ring-[#00E0FF]/30 accent-[#00E0FF]" onchange="saveModalLead()">
                                LinkedIn Outreach Sent
                            </label>
                            <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer hover:text-white transition-colors">
                                <input type="checkbox" id="modal-check-instagram" class="rounded bg-black border-white/20 text-[#00E0FF] focus:ring-[#00E0FF]/30 accent-[#00E0FF]" onchange="saveModalLead()">
                                IG Company Page Visited/Messaged
                            </label>
                        </div>
                    </div>
                    <div>
                        <h4 class="section-label mb-2 flex items-center gap-2"><i class="ph-fill ph-target"></i> LEAD CONTEXT</h4>
                        <textarea id="modal-input-context" rows="4" class="editable-input text-sm leading-relaxed resize-y p-3" style="background:var(--card);border:1px solid var(--border);border-radius:12px" placeholder="Pain points, pitch context..." oninput="debouncedSaveModalLead()"></textarea>
                    </div>
                    <div>
                        <h4 class="section-label mb-2 flex items-center gap-2"><i class="ph-fill ph-megaphone"></i> SALES SCRIPT</h4>
                        <div id="modal-script-box" class="rounded-xl p-4 text-xs leading-relaxed" style="background:var(--card);border:1px solid var(--border);color:var(--text-dim)">
                            <!-- Populated by app.js -->
                        </div>
                    </div>
                </div>
                <div class="flex flex-col max-h-[500px]">
                    <h4 class="section-label mb-2 flex items-center gap-2"><i class="ph-fill ph-activity"></i> ACTIVITY LOG</h4>
                    <div class="rounded-xl flex flex-col flex-1 overflow-hidden" style="background:var(--card);border:1px solid var(--border)">
                        <div id="notes-list" class="flex-1 overflow-y-auto p-3 space-y-2 scrollbar-hide"></div>
                        <div class="p-2.5" style="border-top:1px solid var(--border)">
                            <div class="relative">
                                <input type="text" id="new-note-input" placeholder="LOG NOTE... (CTRL+ENTER)" class="search-box text-sm" style="padding-right:44px;font-size:12px">
                                <button onclick="addNote()" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-md" style="background:var(--cyan);color:#000"><i class="ph-bold ph-paper-plane-right text-sm"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loader" class="loader"><div class="spinner"></div></div>
    <div id="toast" class="toast"><i id="toast-icon"></i><span id="toast-message"></span></div>

    <script src="app.js?v=fix4"></script>
</body>
</html>
